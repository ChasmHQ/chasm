name: Verify offline debugger

on:
  push:
    paths: ['debugger/**', '.github/workflows/debugger.yml']
  pull_request:
    paths: ['debugger/**', '.github/workflows/debugger.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: debugger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run mypy src
      - run: uv run pytest -q tests/test_stepping.py::test_loop_iterates_with_next
      - run: uv run pytest -q

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
