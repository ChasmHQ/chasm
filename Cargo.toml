[package]
name = "chainsmith"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chasm"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
tracing = "0.1"
foundry-compilers = { version = "0.19", features = ["svm-solc"] } # auto-install solc based on pragmas
anyhow = "1.0"
ethers = "2.0" # or alloy, using ethers for now as it's common with foundry-compilers usually
futures = "0.3"
walkdir = "2.5.0"
clap = { version = "4.5.54", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
semver = "1" # solc versions; already in the tree via foundry-compilers
slint = { version = "1.17", features = ["renderer-skia"] }
toml = "0.8"
rand = "0.8"
tempfile = "3"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio-util = "0.7"
png = "0.18"
base64 = "0.22"
flate2 = "1"

[dev-dependencies]
tokio-tungstenite = "0.24"
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }

[build-dependencies]
slint-build = "1.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# The generated Slint UI is one very large module; full debug info made a
# single rustc need over 11 GB. Line tables keep file:line in backtraces.
[profile.dev]
debug = "line-tables-only"
