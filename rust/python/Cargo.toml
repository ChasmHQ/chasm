[package]
name = "chasm-revm-python"
description = "Python bridge for the chasm REVM debugger core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "_revm"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310", "extension-module"] }
revm.workspace = true
chasm-revm-core.workspace = true
chasm-revm-headless.workspace = true
