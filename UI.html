<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sevm — Solidity / EVM debugger</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1018; --panel:#131b28; --panel-alt:#0e1520; --line:#27364d; --text:#dce7f3; --muted:#9aabc2; --accent:#72f1b8; --yellow:#ffd479; --red:#ff8492; --blue:#83b8ff; --focus:#a9c8ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:var(--bg); color:var(--text); font:14px/1.45 ui-sans-serif,system-ui,sans-serif; }
    ::selection { background:#285a4b; color:#f5fffb; } *:focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
    button,input { font:inherit; } button { cursor:pointer; min-height:38px; padding:7px 12px; border:1px solid #38506e; border-radius:8px; color:var(--text); background:#182333; }
    button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); background:#1b2a3d; } button:disabled { cursor:wait; opacity:.58; } button.primary { border-color:var(--accent); background:#17382e; color:var(--accent); }
    kbd { margin-left:7px; color:var(--muted); font-size:11px; } .topbar { display:flex; align-items:center; justify-content:space-between; min-height:68px; padding:0 24px; border-bottom:1px solid var(--line); background:#101825; }
    .brand { display:flex; gap:12px; align-items:center; } .mark { display:grid; width:31px; height:31px; place-items:center; border:1px solid var(--accent); border-radius:8px; color:var(--accent); font-family:ui-monospace,monospace; font-weight:800; }
    .brand strong { letter-spacing:.02em; } .brand small,.muted { color:var(--muted); } .state { display:flex; align-items:center; gap:8px; color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.04em; }
    .state-dot { width:8px; height:8px; border-radius:50%; background:currentColor; } .toolbar { display:flex; gap:8px; padding:13px 24px; border-bottom:1px solid var(--line); background:#0e1520; }
    main { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(280px,.9fr); gap:14px; padding:14px 24px; } .column { display:grid; gap:14px; min-width:0; }
    .card { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--panel); } .card-title { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 14px 9px; border-bottom:1px solid var(--line); color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.09em; }
    .code { min-height:390px; padding:14px 0; overflow:auto; font:13px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace; } .source-line { display:flex; min-width:580px; padding:0 18px; white-space:pre; } .source-line.active { background:#17382e; }
    .line-no { width:42px; color:#596980; user-select:none; } .pointer { width:21px; position:relative; } .source-line.active .pointer::after { content:''; position:absolute; top:.54em; left:2px; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:7px solid var(--accent); }
    .machine { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; } .list { margin:0; padding:10px 14px; list-style:none; font-family:ui-monospace,monospace; font-size:12px; } .list li { display:flex; justify-content:space-between; gap:12px; padding:4px 0; } .list li span:last-child { color:var(--blue); text-align:right; overflow-wrap:anywhere; } .frame-active { color:var(--accent)!important; }
    .stats { display:grid; grid-template-columns:auto 1fr; gap:8px 18px; padding:12px 14px; font-family:ui-monospace,monospace; font-size:12px; } .stats dt { color:var(--muted); } .stats dd { margin:0; color:var(--yellow); }
    .console { margin:0 24px 14px; } .log { height:150px; padding:11px 14px; overflow-y:auto; background:var(--panel-alt); font:12px/1.65 ui-monospace,monospace; } .log p { margin:0; white-space:pre-wrap; } .ok { color:var(--accent); } .notice { color:var(--yellow); } .error { color:var(--red); }
    .prompt { display:flex; align-items:center; gap:9px; padding:11px 14px; border-top:1px solid var(--line); background:#111a27; font-family:ui-monospace,monospace; } .prompt b { color:var(--accent); } .prompt input { flex:1; border:0; outline:0; color:var(--text); background:transparent; }
    .hint { color:var(--muted); font-size:12px; }
    @media (max-width:820px) { .topbar { padding:0 14px; } .toolbar,main { padding-left:14px; padding-right:14px; } main,.machine { grid-template-columns:1fr; } .console { margin-left:14px; margin-right:14px; } .brand small,.hint { display:none; } .toolbar { overflow-x:auto; } button { white-space:nowrap; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="mark">S</div><div><strong>sevm</strong><br><small>Solidity / EVM debugger</small></div></div><div class="state" id="state" aria-live="polite"><span class="state-dot"></span>CONNECTING</div></header>
  <nav class="toolbar" aria-label="Debugger controls"><button class="primary" data-command="continue">Continue <kbd>F5</kbd></button><button data-command="step">Step in <kbd>F7</kbd></button><button data-command="next">Step over <kbd>F8</kbd></button><button data-command="breakpoint">Breakpoint <kbd>F9</kbd></button><button data-command="reset">Restart</button></nav>
  <main>
    <section class="column"><article class="card"><div class="card-title"><span id="source-title">SOURCE</span><span id="location">Loading…</span></div><div class="code" id="source" aria-label="Solidity source code"></div></article><section class="machine"><article class="card"><div class="card-title">DISASSEMBLY</div><ul class="list" id="disassembly"></ul></article><article class="card"><div class="card-title">EVM STACK</div><ul class="list" id="stack"></ul></article><article class="card"><div class="card-title">EXECUTION</div><dl class="stats" id="stats"></dl></article></section></section>
    <aside class="column"><article class="card"><div class="card-title">CALL STACK</div><ul class="list" id="backtrace"></ul></article><article class="card"><div class="card-title">LOCALS</div><ul class="list" id="locals"></ul></article><article class="card"><div class="card-title">STORAGE</div><ul class="list" id="storage"></ul></article></aside>
  </main>
  <section class="console card"><div class="card-title"><span>COMMAND LOG</span><span class="hint">Type an expression or gdb-style command</span></div><div class="log" id="log" aria-live="polite"></div><label class="prompt"><b>(sevm)</b><input id="command" autocomplete="off" placeholder="p amount, step, continue, break Bank.sol:4"></label></section>
  <script>
    const byId = id => document.getElementById(id);
    const command = byId('command');
    let latest = null;
    const text = value => value == null ? '—' : typeof value === 'object' ? JSON.stringify(value) : String(value);
    const list = (id, rows, left, right, active = () => false) => {
      const target = byId(id); target.replaceChildren();
      (rows || []).forEach(row => { const item = document.createElement('li'); const a = document.createElement('span'); const b = document.createElement('span'); a.textContent = text(left(row)); b.textContent = text(right(row)); if (active(row)) item.className = 'frame-active'; item.append(a, b); target.append(item); });
    };
    const addLog = rows => { const target = byId('log'); target.replaceChildren(); (rows || []).forEach(row => { const p = document.createElement('p'); p.textContent = row; p.className = row.startsWith('error:') ? 'error' : row.startsWith('(sevm)') ? 'ok' : 'notice'; target.append(p); }); target.scrollTop = target.scrollHeight; };
    function render(data) {
      latest = data; const report = data.report || {}; const stopped = report.stopped;
      byId('state').innerHTML = '<span class="state-dot"></span>' + (stopped ? `PAUSED · ${report.location?.function || report.mnemonic || ''}` : report.finished ? 'FINISHED' : data.error ? 'ERROR' : 'WAITING');
      addLog(data.log); if (!stopped) { byId('location').textContent = data.error || (report.finished ? 'Program finished — use Restart' : 'Waiting for a stop'); return; }
      const source = data.source || {}; byId('source-title').textContent = `SOURCE · ${source.file || ''}`; byId('location').textContent = `Ln ${report.location?.line || '—'} · PC 0x${Number(report.pc).toString(16)}`;
      const pane = byId('source'); pane.replaceChildren(); (source.items || []).forEach(row => { const div = document.createElement('div'); div.className = 'source-line' + (row.current ? ' active' : ''); const ptr = document.createElement('span'); ptr.className = 'pointer'; const no = document.createElement('span'); no.className = 'line-no'; no.textContent = row.line; const code = document.createElement('span'); code.textContent = row.text || ' '; div.append(ptr, no, code); pane.append(div); });
      list('disassembly', data.disassembly?.rows, r => '0x' + Number(r.pc).toString(16).padStart(4, '0'), r => r.mnemonic || r.opcode, r => r.current);
      list('stack', data.stack?.items, r => String(r.index).padStart(2, '0'), r => r.decimal == null ? r.hex : `${r.hex} · ${r.decimal}`);
      const stats = byId('stats'); stats.replaceChildren(); [['PC', `0x${Number(report.pc).toString(16)}`], ['Gas', report.gas?.remaining], ['Depth', report.depth], ['Opcode', report.mnemonic], ['Step', report.step]].forEach(([k,v]) => { const dt = document.createElement('dt'); const dd = document.createElement('dd'); dt.textContent = k; dd.textContent = text(v); stats.append(dt,dd); });
      list('backtrace', data.backtrace?.frames, r => `${r.index === 0 ? '▶ ' : ''}${r.name}`, r => r.file ? `${r.file}:${r.line || '—'}` : `0x${Number(r.pc).toString(16)}`, r => r.index === 0);
      list('locals', data.locals?.locals, r => r.name || r.label || '', r => `${r.type || ''}${r.value == null ? '' : ' · ' + r.value}`);
      list('storage', data.storage?.items, r => r.name || `slot ${r.slot}`, r => r.value || r.hex || '—');
    }
    async function request(path, options) { const response = await fetch(path, options); const data = await response.json(); render(data); return data; }
    async function send(line) { document.querySelectorAll('button').forEach(b => b.disabled = true); try { await request('/api/command', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({command:line}) }); } catch (error) { render({error:`Could not reach local sevm server: ${error.message}`, log:[]}); } finally { document.querySelectorAll('button').forEach(b => b.disabled = false); command.focus(); } }
    document.querySelectorAll('[data-command]').forEach(button => button.addEventListener('click', () => { const action = button.dataset.command; const here = latest?.report?.location; send(action === 'breakpoint' && here?.file && here?.line ? `b ${here.file}:${here.line}` : action); }));
    command.addEventListener('keydown', event => { if (event.key === 'Enter' && command.value.trim()) { const line = command.value.trim(); command.value = ''; send(line); } });
    document.addEventListener('keydown', event => { if (event.target.matches('input') || event.repeat) return; const actions = {F5:'continue',F7:'step',F8:'next',F9:'breakpoint'}; if (actions[event.key]) { event.preventDefault(); document.querySelector(`[data-command="${actions[event.key]}"]`).click(); } });
    request('/api/state').catch(error => render({error:`Could not reach local sevm server: ${error.message}`, log:[]}));
  </script>
</body>
</html>
